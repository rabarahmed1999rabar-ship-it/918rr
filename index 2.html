    text-align: center;

    font-weight: bold;

    cursor: pointer;
    transition: 0.3s;

  #error { color: #ff6b6b; margin-top: 12px; font-size: 0.9rem; display: none; }

  function checkPass() {
    const val = document.getElementById('pass').value.trim();
    if (val === PASSWORD) {
      document.getElementById('login').style.display = 'none';
      document.getElementById('main').style.display = 'block';
      loadReason();
      startCountdown();
    } else {
      document.getElementById('error').style.display = 'block';
    }
  }

  document.getElementById('pass').addEventListener('keypress', e => {
    if (e.key === 'Enter') checkPass();
  });

  function getDayIndex() {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const start = new Date(START_DATE.getFullYear(), START_DATE.getMonth(), START_DATE.getDate());
    const diff = Math.floor((today - start) / 86400000);
    return diff;
  }

  function toKurdish(n) {
    const ku = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
    return String(n).split('').map(d => ku[d] || d).join('');
  }

    let text;
    if (idx < 0) {
      text = 'هێشتا دەست پێ نەکراوە... بەمنزیکانە.';
    } else {
      // دوای تەواو بوونی هەموو هۆکارەکان، دەگەڕێتەوە سەرەتا
      text = REASONS[idx % REASONS.length];
    }
    document.getElementById('reasonText').textContent = text;

    const pct = Math.min(100, (dayNum / 365) * 100);
    document.getElementById('progress').style.width = pct + '%';
  }

  function startCountdown() {
    setInterval(() => {
      const now = new Date();
      const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
      const diff = tomorrow - now;
      const h = Math.floor(diff / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      document.getElementById('hours').textContent = toKurdish(String(h).padStart(2,'0'));
      document.getElementById('mins').textContent = toKurdish(String(m).padStart(2,'0'));
      document.getElementById('secs').textContent = toKurdish(String(s).padStart(2,'0'));
    }, 1000);
  }
</script>
</body>
</html>
